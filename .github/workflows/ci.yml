name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

# Local dummy values only. Do not add SUPABASE_ACCESS_TOKEN,
# SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_ID, or other hosted-project secrets.
# This workflow must never link to or reach the production Supabase project.
permissions:
  contents: read

jobs:
  api-test:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ADMIN_API_KEY: ci-dummy-admin-key
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-role-key
      CRON_SECRET: ci-dummy-cron-secret
      STRIPE_WEBHOOK_SECRET: ci-dummy-stripe-webhook-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest suite
        run: npm test

      - name: Run waiver schema guard
        run: npm run guard:waiver-schema

  pgtap:
    name: pgTAP (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.105.0

      - name: Start local Supabase
        run: >
          supabase start
          -x studio,imgproxy,inbucket,realtime,storage,analytics,vector,edge-runtime,functions,meta,kong,rest

      - name: Reset local database
        run: supabase db reset --local

      - name: Run pgTAP
        run: supabase test db supabase/tests/database --local
