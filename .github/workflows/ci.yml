name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

# Local dummy values only. Do not add SUPABASE_ACCESS_TOKEN,
# SUPABASE_DB_PASSWORD, SUPABASE_PROJECT_ID, or other hosted-project secrets.
# This workflow must never link to or reach the production Supabase project.
permissions:
  contents: read
  pull-requests: read

jobs:
  api-test:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ADMIN_API_KEY: ci-dummy-admin-key
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-role-key
      CRON_SECRET: ci-dummy-cron-secret
      STRIPE_WEBHOOK_SECRET: ci-dummy-stripe-webhook-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest suite
        run: npm test

      - name: Run waiver schema guard
        run: npm run guard:waiver-schema

  # Job-level filter (not workflow on.<event>.paths): the workflow always
  # starts, so a required "pgTAP (local Supabase)" check still reports.
  # GitHub treats a skipped job as success, so PRs that only touch API code
  # are not blocked. Workflow-level paths would skip the whole workflow and
  # leave that required check pending.
  changes:
    name: Detect database changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      database: ${{ steps.filter.outputs.database }}
    steps:
      # Push events diff with git against the previous commit on this branch
      # and need history. pull_request events use the GitHub API instead.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter database paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          # Same-branch compare on push to develop/main (only this push).
          # Ignored on pull_request; those compare against the PR base.
          # Default would be `main`, which would treat every develop push
          # as changing supabase files.
          base: ${{ github.ref }}
          list-files: json
          filters: |
            database:
              - 'supabase/**'
              - '.github/workflows/ci.yml'

      - name: Database path filter result
        env:
          DATABASE_CHANGED: ${{ steps.filter.outputs.database }}
          DATABASE_FILES: ${{ steps.filter.outputs.database_files }}
        run: |
          echo "database changed: $DATABASE_CHANGED"
          echo "matching files: $DATABASE_FILES"

  pgtap:
    name: pgTAP (local Supabase)
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.105.0

      # CLI 2.105.0 exclude names: edge-runtime, gotrue, imgproxy, kong,
      # logflare, mailpit, postgres-meta, postgrest, realtime, storage-api,
      # studio, supavisor, vector. Keep kong + postgrest so the :54321
      # health check can succeed; pgTAP only needs the local Postgres.
      - name: Start local Supabase
        run: >
          supabase start
          -x studio,imgproxy,mailpit,realtime,storage-api,logflare,vector,supavisor,edge-runtime,postgres-meta,gotrue

      - name: Reset local database
        run: supabase db reset --local

      - name: Run pgTAP
        run: supabase test db supabase/tests/database --local
